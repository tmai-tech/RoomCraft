name: room_craft
description: A room blueprint and furniture planner.
publish_to: 'none'
version: 1.0.0-beta.1+36

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  firebase_core: ^2.27.0
  firebase_auth: ^4.17.6
  cloud_firestore: ^4.15.6
  google_sign_in: ^6.2.1
  uuid: ^4.3.3
  image_picker: ^1.0.7
  google_generative_ai: ^0.4.0
  mime: ^1.0.4
  shared_preferences: ^2.2.2
  url_launcher: ^6.2.4
  share_plus: ^10.0.0
  path_provider: ^2.1.6
  image: ^4.9.1
  http: ^1.2.2
  flutter_secure_storage: ^10.3.1
  firebase_analytics: ^10.10.7
  video_thumbnail: ^0.5.6
  path: ^1.9.1
  firebase_storage: ^11.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/images/
