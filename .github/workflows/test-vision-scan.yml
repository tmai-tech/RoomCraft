# Live vision smoke test on real feedback room photos (Groq).
name: Test vision scan

on:
  workflow_dispatch:

jobs:
  test-vision:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Prepare fixture images
        run: |
          mkdir -p /tmp/roomcraft-feedback
          cp test/fixtures/room_feedback/53a501e6-018_preview_*.jpg /tmp/roomcraft-feedback/
          ls -la /tmp/roomcraft-feedback/
      - name: Run Groq vision smoke test
        env:
          ROOMCRAFT_GROQ_API_KEY: ${{ secrets.ROOMCRAFT_GROQ_API_KEY }}
        run: node scripts/test-vision-scan.mjs
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vision-scan-result
          path: |
            /tmp/roomcraft-feedback/live_scan_result.json
            /tmp/roomcraft-feedback/*.jpg
          if-no-files-found: ignore
