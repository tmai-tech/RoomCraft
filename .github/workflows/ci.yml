name: CI

on:
  push:
    branches:
      - main
      - master
      - dev
      - 'feat/**'
      - 'fix/**'
      - 'ci/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Analyze + test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Flutter analyze
        # Prefer real errors/warnings; style infos should not block beta ships.
        run: flutter analyze --fatal-warnings

      - name: Flutter test
        run: flutter test --coverage

      - name: Live vision smoke test (feedback room photos)
        if: ${{ secrets.ROOMCRAFT_GROQ_API_KEY != '' }}
        continue-on-error: true
        env:
          ROOMCRAFT_GROQ_API_KEY: ${{ secrets.ROOMCRAFT_GROQ_API_KEY }}
        run: |
          mkdir -p /tmp/roomcraft-feedback
          cp test/fixtures/room_feedback/53a501e6-018_preview_*.jpg /tmp/roomcraft-feedback/
          node scripts/test-vision-scan.mjs

      - name: Upload vision result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vision-scan-result
          path: /tmp/roomcraft-feedback/live_scan_result.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/lcov.info
          if-no-files-found: ignore
          retention-days: 14
