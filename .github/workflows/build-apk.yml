name: Build APK

on:
  push:
    branches:
      - main
      - master
      - dev
      - 'feat/**'
      - 'fix/**'
      - 'ci/**'
    paths-ignore:
      - '**.md'
      - 'LICENSE*'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'LICENSE*'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      tester_groups:
        description: 'Firebase tester groups (comma-separated, optional)'
        required: false
        default: ''
        type: string
      release_notes:
        description: 'Optional release notes for testers'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: apk-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Assemble debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Locate APK
        id: apk
        run: |
          set -euo pipefail
          APK=$(find build/app/outputs -name "*.apk" -type f | head -n 1)
          if [ -z "${APK:-}" ]; then
            echo "::error::No APK found under build/app/outputs"
            find build -type f -name "*.apk" 2>/dev/null || true
            find build/app/outputs -type f 2>/dev/null || true
            exit 1
          fi
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "Found APK: $APK ($(du -h "$APK" | cut -f1))"

      - name: Rename APK for artifact
        id: named
        run: |
          set -euo pipefail
          SRC="${{ steps.apk.outputs.path }}"
          OUT_DIR="build/app/outputs/flutter-apk"
          mkdir -p "$OUT_DIR"
          OUT="${OUT_DIR}/roomcraft-debug-${GITHUB_SHA::7}.apk"
          cp "$SRC" "$OUT"
          echo "path=$OUT" >> "$GITHUB_OUTPUT"
          echo "filename=$(basename "$OUT")" >> "$GITHUB_OUTPUT"
          ls -lh "$OUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: roomcraft-debug-${{ github.sha }}
          path: ${{ steps.named.outputs.path }}
          if-no-files-found: error
          retention-days: 30

      # Firebase App Distribution — needs FIREBASE_ANDROID_APP_ID + FIREBASE_SERVICE_ACCOUNT
      - name: Upload to Firebase App Distribution
        if: github.event_name != 'pull_request'
        env:
          FIREBASE_ANDROID_APP_ID: ${{ secrets.FIREBASE_ANDROID_APP_ID }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_TESTER_GROUPS: ${{ secrets.FIREBASE_TESTER_GROUPS }}
          INPUT_GROUPS: ${{ github.event.inputs.tester_groups }}
          INPUT_NOTES: ${{ github.event.inputs.release_notes }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          APK_PATH: ${{ steps.named.outputs.path }}
        run: |
          set -euo pipefail

          if [ -z "${FIREBASE_ANDROID_APP_ID:-}" ] || [ -z "${FIREBASE_SERVICE_ACCOUNT:-}" ]; then
            echo "::notice::Firebase App Distribution skipped — set secrets FIREBASE_ANDROID_APP_ID and FIREBASE_SERVICE_ACCOUNT."
            echo "See docs/FIREBASE_APP_DISTRIBUTION.md"
            exit 0
          fi

          GROUPS="${INPUT_GROUPS:-}"
          if [ -z "${GROUPS}" ]; then
            GROUPS="${FIREBASE_TESTER_GROUPS:-}"
          fi

          if [ -n "${INPUT_NOTES:-}" ]; then
            NOTES="${INPUT_NOTES}"
          else
            MSG="${COMMIT_MSG:-Manual / workflow_dispatch build}"
            NOTES=$(printf 'RoomCraft %s @ %s\n\n%s\n\nRun: %s/%s/actions/runs/%s' \
              "${GITHUB_REF_NAME}" "${GITHUB_SHA::7}" "${MSG}" \
              "${{ github.server_url }}" "${{ github.repository }}" "${{ github.run_id }}")
          fi

          echo "${FIREBASE_SERVICE_ACCOUNT}" > "${RUNNER_TEMP}/firebase-sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="${RUNNER_TEMP}/firebase-sa.json"

          npm install -g firebase-tools

          EXTRA=()
          if [ -n "${GROUPS}" ]; then
            EXTRA+=(--groups "${GROUPS}")
            echo "Uploading ${APK_PATH} to Firebase App Distribution (groups: ${GROUPS})"
          else
            echo "Uploading ${APK_PATH} to Firebase App Distribution (no groups — invite testers in console)"
          fi

          set +e
          firebase appdistribution:distribute "${APK_PATH}" \
            --app "${FIREBASE_ANDROID_APP_ID}" \
            --release-notes "${NOTES}" \
            "${EXTRA[@]}"
          RC=$?
          set -e

          rm -f "${RUNNER_TEMP}/firebase-sa.json"

          if [ "$RC" -ne 0 ]; then
            # Upload may have succeeded while group invite failed (missing group).
            echo "::warning::firebase appdistribution:distribute exited with $RC (often missing tester group)."
            if [ -n "${GROUPS}" ]; then
              echo "Create group '${GROUPS}' in Firebase App Distribution console, or clear FIREBASE_TESTER_GROUPS / tester_groups input."
            fi
            # Fail only if binary upload likely failed — re-check by attempting a dry second path is hard;
            # Prefer soft-fail for group issues: exit 0 when groups were specified and RC!=0 after possible upload.
            # Hard-fail when no groups (pure upload failure).
            if [ -z "${GROUPS}" ]; then
              exit "$RC"
            fi
            echo "APK was likely uploaded; group distribution failed. Check Firebase console releases."
            exit 0
          fi

          echo "Firebase App Distribution upload complete."
