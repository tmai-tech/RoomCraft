name: Build APK

on:
  push:
    branches:
      - main
      - master
      - dev
      - 'feat/**'
      - 'fix/**'
      - 'ci/**'
    paths-ignore:
      - '**.md'
      - 'LICENSE*'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'LICENSE*'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      tester_groups:
        description: 'Firebase tester groups (comma-separated, optional)'
        required: false
        default: ''
        type: string
      release_notes:
        description: 'Optional release notes for testers'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: apk-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Assemble debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      # Stable signing so Google Sign-In SHA-1 stays fixed across CI builds.
      # Secrets: ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
      # ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD (see docs/PLAY_AND_SIGNING.md).
      - name: Decode upload keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "::notice::No ANDROID_KEYSTORE_BASE64 — using default debug keystore (Google Sign-In SHA will vary)."
            exit 0
          fi
          mkdir -p android
          echo "${ANDROID_KEYSTORE_BASE64}" | base64 -d > android/ci-upload.keystore
          cat > android/key.properties <<EOF
          storePassword=${ANDROID_KEYSTORE_PASSWORD}
          keyPassword=${ANDROID_KEY_PASSWORD:-$ANDROID_KEYSTORE_PASSWORD}
          keyAlias=${ANDROID_KEY_ALIAS:-roomcraft}
          storeFile=ci-upload.keystore
          EOF
          # Strip accidental leading spaces from heredoc indentation
          sed -i 's/^[[:space:]]*//' android/key.properties
          echo "Wrote android/key.properties + ci-upload.keystore for stable SHA signing"

      # Optional free vision keys — testers never paste keys in the app.
      # Set GitHub secrets ROOMCRAFT_GROQ_API_KEY and/or ROOMCRAFT_GEMINI_API_KEY.
      - name: Build debug APK
        env:
          ROOMCRAFT_GROQ_API_KEY: ${{ secrets.ROOMCRAFT_GROQ_API_KEY }}
          ROOMCRAFT_GEMINI_API_KEY: ${{ secrets.ROOMCRAFT_GEMINI_API_KEY }}
          ROOMCRAFT_GOOGLE_SERVER_CLIENT_ID: ${{ secrets.ROOMCRAFT_GOOGLE_SERVER_CLIENT_ID }}
        run: |
          set -euo pipefail
          DEFS=()
          if [ -n "${ROOMCRAFT_GROQ_API_KEY:-}" ]; then
            DEFS+=(--dart-define=ROOMCRAFT_GROQ_API_KEY="${ROOMCRAFT_GROQ_API_KEY}")
            echo "Bundling free Groq vision key for no-user-key scans"
          else
            echo "No ROOMCRAFT_GROQ_API_KEY secret — offline accurate scan only"
          fi
          if [ -n "${ROOMCRAFT_GEMINI_API_KEY:-}" ]; then
            DEFS+=(--dart-define=ROOMCRAFT_GEMINI_API_KEY="${ROOMCRAFT_GEMINI_API_KEY}")
            echo "Bundling Gemini assist key"
          fi
          if [ -n "${ROOMCRAFT_GOOGLE_SERVER_CLIENT_ID:-}" ]; then
            DEFS+=(--dart-define=ROOMCRAFT_GOOGLE_SERVER_CLIENT_ID="${ROOMCRAFT_GOOGLE_SERVER_CLIENT_ID}")
            echo "Bundling Google Sign-In web client id"
          fi
          flutter build apk --debug "${DEFS[@]}"

      - name: Locate APK
        id: apk
        run: |
          set -euo pipefail
          APK=$(find build/app/outputs -name "*.apk" -type f | head -n 1)
          if [ -z "${APK:-}" ]; then
            echo "::error::No APK found under build/app/outputs"
            find build -type f -name "*.apk" 2>/dev/null || true
            find build/app/outputs -type f 2>/dev/null || true
            exit 1
          fi
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "Found APK: $APK ($(du -h "$APK" | cut -f1))"

      - name: Rename APK for artifact
        id: named
        run: |
          set -euo pipefail
          SRC="${{ steps.apk.outputs.path }}"
          OUT_DIR="build/app/outputs/flutter-apk"
          mkdir -p "$OUT_DIR"
          OUT="${OUT_DIR}/roomcraft-debug-${GITHUB_SHA::7}.apk"
          cp "$SRC" "$OUT"
          echo "path=$OUT" >> "$GITHUB_OUTPUT"
          echo "filename=$(basename "$OUT")" >> "$GITHUB_OUTPUT"
          ls -lh "$OUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: roomcraft-debug-${{ github.sha }}
          path: ${{ steps.named.outputs.path }}
          if-no-files-found: error
          retention-days: 30

      # Firebase App Distribution — needs FIREBASE_ANDROID_APP_ID + FIREBASE_SERVICE_ACCOUNT
      # Soft-fail: APK artifact is already uploaded; distribute must not fail the job.
      - name: Upload to Firebase App Distribution
        if: github.event_name != 'pull_request'
        continue-on-error: true
        env:
          FIREBASE_ANDROID_APP_ID: ${{ secrets.FIREBASE_ANDROID_APP_ID }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_TESTER_GROUPS: ${{ secrets.FIREBASE_TESTER_GROUPS }}
          INPUT_GROUPS: ${{ github.event.inputs.tester_groups }}
          INPUT_NOTES: ${{ github.event.inputs.release_notes }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          APK_PATH: ${{ steps.named.outputs.path }}
        run: |
          # Avoid set -e / pipefail so early group resolution never aborts the step.
          set -u

          echo "Firebase distribute step starting…"

          if [ -z "${FIREBASE_ANDROID_APP_ID:-}" ] || [ -z "${FIREBASE_SERVICE_ACCOUNT:-}" ]; then
            echo "::notice::Firebase App Distribution skipped — set secrets FIREBASE_ANDROID_APP_ID and FIREBASE_SERVICE_ACCOUNT."
            echo "See docs/FIREBASE_APP_DISTRIBUTION.md"
            exit 0
          fi

          # Prefer workflow input, then secret alias, then hard default "testers".
          # FIREBASE_TESTER_GROUPS must be the *alias* (e.g. testers), never a numeric group id.
          # Use FAD_GROUPS (not GROUPS) — GROUPS can be a bash array in some environments.
          FAD_GROUPS="${INPUT_GROUPS:-}"
          if [ -z "${FAD_GROUPS}" ]; then
            FAD_GROUPS="${FIREBASE_TESTER_GROUPS:-}"
          fi
          if [ -z "${FAD_GROUPS}" ]; then
            FAD_GROUPS="testers"
          fi
          # Trim whitespace (no pipefail dependency)
          FAD_GROUPS=$(echo "${FAD_GROUPS}" | tr -d '[:space:]')
          # Empty or pure-numeric (legacy id 1001 etc.) → alias "testers"
          case "${FAD_GROUPS}" in
            ""|1001)
              echo "::warning::Invalid/empty tester group; using alias testers"
              FAD_GROUPS="testers"
              ;;
            *[!0-9]*)
              # contains a non-digit → treat as alias (e.g. testers)
              ;;
            *)
              echo "::warning::FIREBASE_TESTER_GROUPS looks numeric; using alias testers"
              FAD_GROUPS="testers"
              ;;
          esac
          echo "Resolved tester group alias: ${FAD_GROUPS}"

          if [ -n "${INPUT_NOTES:-}" ]; then
            NOTES="${INPUT_NOTES}"
          else
            MSG="${COMMIT_MSG:-Manual / workflow_dispatch build}"
            # %s-only printf — never pass MSG as format string
            NOTES=$(printf 'RoomCraft %s @ %s\n\n%s\n\nRun: %s/%s/actions/runs/%s' \
              "${GITHUB_REF_NAME}" "${GITHUB_SHA::7}" "${MSG}" \
              "${{ github.server_url }}" "${{ github.repository }}" "${{ github.run_id }}")
          fi

          SA_FILE="${RUNNER_TEMP}/firebase-sa.json"
          printf '%s\n' "${FIREBASE_SERVICE_ACCOUNT}" > "${SA_FILE}"
          export GOOGLE_APPLICATION_CREDENTIALS="${SA_FILE}"

          npm install -g firebase-tools

          echo "Uploading ${APK_PATH} to Firebase App Distribution (groups: ${FAD_GROUPS})"

          set +e
          firebase appdistribution:distribute "${APK_PATH}" \
            --app "${FIREBASE_ANDROID_APP_ID}" \
            --groups "${FAD_GROUPS}" \
            --release-notes "${NOTES}"
          RC=$?

          rm -f "${SA_FILE}"

          if [ "$RC" -ne 0 ]; then
            echo "::warning::firebase appdistribution:distribute exited with $RC"
            echo "APK artifact is still available on this run. Check Firebase console / group '${FAD_GROUPS}'."
            exit 0
          fi

          echo "Firebase App Distribution upload complete."
