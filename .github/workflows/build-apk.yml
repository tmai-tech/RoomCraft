name: Build APK

on:
  push:
    branches:
      - main
      - 'feat/**'
      - 'fix/**'
      - 'ci/**'
    paths-ignore:
      - '**.md'
      - 'LICENSE*'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'LICENSE*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apk-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Assemble debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Locate APK
        id: apk
        run: |
          set -euo pipefail
          APK=$(find build/app/outputs -name "*.apk" -type f | head -n 1)
          if [ -z "${APK:-}" ]; then
            echo "::error::No APK found under build/app/outputs"
            find build -type f -name "*.apk" 2>/dev/null || true
            find build/app/outputs -type f 2>/dev/null || true
            exit 1
          fi
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "Found APK: $APK ($(du -h "$APK" | cut -f1))"

      - name: Rename APK for artifact
        id: named
        run: |
          set -euo pipefail
          SRC="${{ steps.apk.outputs.path }}"
          OUT_DIR="build/app/outputs/flutter-apk"
          mkdir -p "$OUT_DIR"
          OUT="${OUT_DIR}/roomcraft-debug-${GITHUB_SHA::7}.apk"
          cp "$SRC" "$OUT"
          echo "path=$OUT" >> "$GITHUB_OUTPUT"
          echo "filename=$(basename "$OUT")" >> "$GITHUB_OUTPUT"
          ls -lh "$OUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: roomcraft-debug-${{ github.sha }}
          path: ${{ steps.named.outputs.path }}
          if-no-files-found: error
          retention-days: 30
